<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c121c"><meta name="app-version" content="3.2.3">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sterling"><meta name="description" content="Your compact, offline-ready Sterling shift workspace.">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="sterling-specialty-icon-full.png">
<link rel="stylesheet" href="app.css?v=3.2.3"><script src="report.js?v=3.2.3" defer></script><script src="app.js?v=3.2.3" defer></script>
<title>Sterling · Shift workspace</title></head><body>
<main>
<header class="brand-header"><img src="sterling-specialty-icon-full.png" width="38" height="38" alt="Sterling Specialty"><span class="version">3.2.3</span><button id="menu-toggle" type="button" aria-label="App menu" aria-controls="app-menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h18"/></svg></button><nav id="app-menu" class="menu-items" aria-label="App shortcuts" hidden><a id="maintenance-request" href="https://forms.cloud.microsoft/pages/responsepage.aspx?id=PcWvcY-2bEqoNOh2Xu0gYjYirSKb_9RJnPVbEZGRGXVUOVlHOFhDN1RGUkJZVFNDSjI5NFM0WjJaNC4u&amp;origin=QRCode&amp;route=shorturl" target="_blank" rel="noopener noreferrer">Maintenance</a><a id="hazards-request" href="https://app.industrysafe.com/default.asp?__hstc=108400413.b5ab5a05ea64dff45301da1252f9e8e6.1685735468245.1732722102562.1732744063648.841&amp;__hssc=108400413.5.1732744063648&amp;__hsfp=2522753148" target="_blank" rel="noopener noreferrer">Vector</a><a id="bbs-request" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=PcWvcY-2bEqoNOh2Xu0gYvc20LGvfjhIt1-2If4mnyNUMVdXTzU4VVg1V0Y2N0JMME1BS1lKQzVZSy4u&amp;origin=QRCode" target="_blank" rel="noopener noreferrer">BBS <i class="daily-dot" aria-hidden="true"></i></a><button id="report-request" type="button">Report <i class="daily-dot" aria-hidden="true"></i></button><button id="export" type="button">Export CSV</button></nav></header>
<section id="home-panel" class="panel" aria-label="Shift counters">
<details id="mix-converter" class="utility-card" open><summary><span>Mix conversion</span><span>lb → kg</span></summary><div class="calc-row"><label class="sr-only" for="mix-input">Pounds to convert to kilograms</label><input id="mix-input" type="number" min="0" inputmode="decimal" placeholder="Pounds"><button id="calculate" type="button">Convert</button></div><output id="conversion-result" aria-live="polite"></output></details>
<div class="section-title"><h2>Mix counts</h2><span id="mix-total"></span></div><div class="category-actions undo-only"><button id="undo-mix" class="small-undo" type="button" aria-label="Undo last mix count"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/></svg></button></div><div id="mix" class="counter-grid"></div>
<div class="section-title"><h2>Hold tank</h2><span>Current reading</span></div><div class="hold-grid">
<label class="field">Total weight<div class="input-unit"><input id="pounds" type="number" inputmode="decimal" min="0" step="any"><span>lb</span></div></label>
<label class="field">AMD concentration<div class="input-unit"><input id="amd" type="number" inputmode="decimal" min="0" max="100" step="any"><span>%</span></div></label></div>
<div class="section-title"><h2>Unload counts</h2><span id="unload-total"></span></div><div class="category-actions undo-only"><button id="undo-unload" class="small-undo" type="button" aria-label="Undo last unload count"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/></svg></button><button id="reset" class="small-undo danger" type="button" aria-label="Reset counts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="trucks" class="counter-grid unload-grid"></div>
<div class="category-actions share-row"><button id="share" type="button" aria-label="Share counts and hold tank readings">Share</button></div>
<section class="levels-section" aria-label="Tank levels"><div class="section-title"><h2>Tank levels</h2></div><div id="level-counters" class="level-grid"></div><div class="category-actions share-row"><button id="share-levels" type="button" aria-label="Share tank levels">Share</button><button id="reset-levels" class="text-button danger" type="button">Reset levels</button></div></section>

<section id="calendar-details" class="utility-card always-calendar"><h2>Calendar & shortcuts</h2><div class="shortcut-links"><a href="https://calendar.google.com/calendar/u/0/r" target="_blank" rel="noopener noreferrer">Google Calendar ↗</a><a id="adp-request" href="adpmobile://">Open ADP ↗</a></div><div id="calendar-holder"></div></section>
<p class="device-note">Counters stay on this device. Daily dots reset at 6:10 am CT.</p>
</section>
<dialog id="report-panel" aria-labelledby="report-title">
<form id="report-form">
  <label id="report-title" for="report-notes">Sterling report</label>
  <textarea id="report-notes" rows="6" placeholder="Type or use your keyboard microphone" required autofocus></textarea>
  <p id="report-error" role="status" hidden></p>
  <button class="primary-button" type="submit">Submit</button>
</form>
</dialog>
</main>

<div id="toast" role="status" aria-live="polite"></div>
</body></html>
