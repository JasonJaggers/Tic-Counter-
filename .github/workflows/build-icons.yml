name: Generate iOS Home Screen Icons
on:
  push:
    paths:
      - '.github/workflows/build-icons.yml'
      - 'tank-icon.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Generate PNG icons from embedded tank image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import re, base64
          svg = Path('tank-icon.svg').read_text()
          match = re.search(r'base64,([A-Za-z0-9+/=]+)', svg)
          assert match, 'Missing tank image'
          image = Image.open(BytesIO(base64.b64decode(match.group(1)))).convert('RGB')
          for size in (180, 192, 512):
              image.resize((size,size),Image.Resampling.LANCZOS).save(f'tank-icon-{size}.png',optimize=True)
          PY
      - name: Commit PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tank-icon-180.png tank-icon-192.png tank-icon-512.png
          if ! git diff --cached --quiet; then git commit -m "Add native PNG Home Screen icons"; git push; fi
